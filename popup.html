<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn → Claude</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #000000;
    }

    .header {
      background: #0a66c2;
      color: #ffffff;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .counter {
      font-size: 14px;
      opacity: 0.9;
      margin-top: 4px;
    }

    .counter-value {
      font-weight: 700;
      font-size: 24px;
      display: block;
      margin-top: 4px;
    }

    .content {
      padding: 20px;
    }

    .button {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .button-primary {
      background: #0a66c2;
      color: #ffffff;
    }

    .button-primary:hover:not(:disabled) {
      background: #004182;
    }

    .button-secondary {
      background: #e7f3ff;
      color: #0a66c2;
      border: 2px solid #0a66c2;
    }

    .button-secondary:hover:not(:disabled) {
      background: #d0e8ff;
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      min-height: 40px;
    }

    .status.info {
      background: #e7f3ff;
      color: #0a66c2;
      border-left: 3px solid #0a66c2;
    }

    .status.success {
      background: #e8f5e9;
      color: #2e7d32;
      border-left: 3px solid #4caf50;
    }

    .status.error {
      background: #ffebee;
      color: #c62828;
      border-left: 3px solid #f44336;
    }

    .status.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>LinkedIn → Claude</h1>
    <div class="counter">
      Connections Found
      <span class="counter-value" id="counter">0</span>
    </div>
  </div>

  <div class="content">
    <button id="extractBtn" class="button button-primary">
      1. Extract Connections
    </button>

    <button id="copyBtn" class="button button-secondary" disabled>
      2. Copy for Claude
    </button>

    <div id="status" class="status hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
